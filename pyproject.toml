[build-system]
# build the package with [flit](https://flit.readthedocs.io)
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "easybuild-jupyter-kernels"
dynamic = ["version"]
description = ""
authors = [
    { name = "Davide Grassano" },
]
readme = "README.md"
license = { file = "LICENSE.txt" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["easybuild"]
requires-python = ">=3.9"
dependencies = [
    "jupyter_client",
]

[project.urls]
Source = "https://github.com/crivella/easybuild_jupyter_kernels"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-jupyter[server]",
]
pre-commit = [
    "pre-commit",
    "pylint",
    "pylint-pytest",
]
release = [
    "flit"
]

[tool.flit.module]
name = "easybuild_jupyter_kernels"

[tool.flit.sdist]
exclude = [
    ".gitignore", ".github", ".pre-commit-config.yaml",
    "tests/", "tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
load-plugins = [
    "pylint_pytest"
]

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
    "global-statement",
    "broad-exception-caught",
    "too-few-public-methods",
]


[tool.pylint.format]
max-line-length = 120
good-names = [
    "_", "k", "v",
]

[tool.pylint.design]
max-args = 10
max-locals = 30
max-attributes = 12
max-positional-arguments = 10

[tool.tox]
requires = ["tox>=4"]
env_list = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
commands = [["pytest", "tests"]]
deps = [".[tests]"]
